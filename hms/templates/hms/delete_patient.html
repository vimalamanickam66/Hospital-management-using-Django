<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Patient</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            padding: 40px;
            text-align: center;
        }
        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        button {
            background: #d9534f;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }
        a {
            text-decoration: none;
            margin-left: 10px;
            background: #6c757d;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Delete Patient</h2>
        <p>Are you sure you want to delete <strong>{{ patient.name }}</strong>?</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit">Yes, Delete</button>
            <a href="{% url 'dashboard' %}">Cancel</a>
        </form>
    </div>
</body>
</html>
